on:
  push:
    branches:
      - master
      - main # Also include main branch if you use it

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: FTP Deploy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # optional: specify a directory on the server
        server-dir: ./
        # optional: specify a local directory to upload from
        local-dir: ./
        # optional: use ftps for full encryption (recommended)
        protocol: ftps
